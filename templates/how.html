{% extends "base.html" %}
{% block content %}
<section class="page-intro">
  {% include "_crumbs.html" %}
  <p class="eyebrow">{{ content.how_kicker }}</p>
  <h1>{{ content.how_title }}</h1>
  <p>{{ content.how_lede }}</p>
</section>
<section class="section">
  <div class="steps">
    {% for step in content.steps %}
    <article class="step-row {% if loop.index is even %}flip{% endif %}">
      <img src="{{ step.image }}" alt="{{ step.title }}" loading="lazy" decoding="async">
      <div>
        <p class="eyebrow">{{ step.eyebrow }}</p>
        <h2>{{ step.title }}</h2>
        <p>{{ step.text }}</p>
      </div>
    </article>
    {% endfor %}
  </div>
  <p class="center-cta"><a class="btn" href="{{ url_for('public.fleet') }}">Jetzt Modell wählen</a></p>
</section>
{% endblock %}
