{% extends "admin/base.html" %}
{% block body %}
<header class="page-head"><h1>Lieferzonen</h1></header>
<p class="fine">Der längste passende PLZ-Präfix gewinnt. <code>*</code> gilt für jede fünfstellige PLZ ohne genaueren Treffer. Orte greifen, wenn keine PLZ in der Adresse steht.</p>
{% for zone in zones %}
<form class="panel form-grid" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="zone_id" value="{{ zone.id }}">
  <div class="pair">
    <label>Name<input name="name" value="{{ zone.name }}"></label>
    <label>Preis<input name="price" value="{{ money_input(zone.price_cents) }}"></label>
    <label>Reihenfolge<input name="sort_order" type="number" value="{{ zone.sort_order }}"></label>
  </div>
  <label>PLZ-Präfixe<input name="prefixes" value="{{ zone.prefixes }}"></label>
  <label>Orte<input name="cities" value="{{ zone.cities }}"></label>
  <label>Notiz<input name="note" value="{{ zone.note }}"></label>
  <label class="check"><input type="checkbox" name="active" value="1" {% if zone.active %}checked{% endif %}> aktiv</label>
  <button class="btn" type="submit">Speichern</button>
</form>
<form method="post" action="{{ url_for('admin.zone_delete', zone_id=zone.id) }}" onsubmit="return confirm('Zone löschen?');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn danger" type="submit">Löschen</button>
</form>
{% endfor %}
<h2>Neue Zone</h2>
<form class="panel form-grid" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="pair">
    <label>Name<input name="name" required></label>
    <label>Preis<input name="price" value="0"></label>
    <label>Reihenfolge<input name="sort_order" type="number" value="10"></label>
  </div>
  <label>PLZ-Präfixe<input name="prefixes" placeholder="80,81 oder *"></label>
  <label>Orte<input name="cities" placeholder="muenchen, münchen"></label>
  <label>Notiz<input name="note"></label>
  <label class="check"><input type="checkbox" name="active" value="1" checked> aktiv</label>
  <button class="btn" type="submit">Anlegen</button>
</form>
{% endblock %}
