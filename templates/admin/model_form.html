{% extends "admin/base.html" %}
{% block body %}
<header class="page-head"><h1>{{ title }}</h1></header>
<form class="panel form-grid" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="pair">
    <label>Name<input name="name" required value="{{ model.name if model else '' }}"></label>
    <label>Untertitel<input name="subtitle" value="{{ model.subtitle if model else '' }}"></label>
  </div>
  <div class="pair">
    <label>Slug<input name="slug" value="{{ model.slug if model else '' }}" placeholder="wird aus dem Namen"></label>
    <label>Badge<input name="badge" value="{{ model.badge if model else '' }}"></label>
  </div>
  <div class="pair">
    <label>Preis pro Tag<input name="price" required value="{% if model %}{{ money_input(model.price_cents) }}{% endif %}"></label>
    <label>Reihenfolge<input name="sort_order" type="number" value="{{ model.sort_order if model else 0 }}"></label>
  </div>
  <div class="pair">
    <label>Personen von<input name="capacity_min" type="number" min="1" required value="{{ model.capacity_min if model else 2 }}"></label>
    <label>Personen bis<input name="capacity_max" type="number" min="1" required value="{{ model.capacity_max if model else 4 }}"></label>
    <label>Geräte<input name="units" type="number" min="1" max="20" value="{{ model.units if model else 1 }}"></label>
    <label>Größe
      <select name="size">
        {% for key, label in sizes %}
        <option value="{{ key }}" {% if model and model.size == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label class="check"><input type="checkbox" name="active" value="1" {% if not model or model.active %}checked{% endif %}> aktiv und buchbar</label>
  <label>Kurztext<textarea name="summary" rows="3" required>{{ model.summary if model else '' }}</textarea></label>
  <label>Geschichte, Überschrift<input name="story_title" value="{{ model.story_title if model else '' }}"></label>
  <label>Geschichte<textarea name="story" rows="5" required>{{ model.story if model else '' }}</textarea></label>
  <label>Highlights, eine Zeile pro Punkt<textarea name="highlights" rows="4">{{ highlights }}</textarea></label>
  <label>Enthalten, eine Zeile pro Punkt<textarea name="included_text" rows="4">{{ model.included_text if model else '' }}</textarea></label>
  <label>Nicht enthalten, eine Zeile pro Punkt<textarea name="excluded_text" rows="4">{{ model.excluded_text if model else '' }}</textarea></label>
  <fieldset>
    <legend>Merkmale auf der Karte</legend>
    {% for feature in features %}
    <div class="pair">
      <select name="feature_icon">{% for icon in icons %}<option value="{{ icon }}" {% if feature.icon == icon %}selected{% endif %}>{{ icon }}</option>{% endfor %}</select>
      <input name="feature_label" value="{{ feature.label }}" placeholder="Beschriftung">
    </div>
    {% endfor %}
  </fieldset>
  <fieldset>
    <legend>Kennzahlen</legend>
    {% for spec in specs %}
    <div class="pair">
      <select name="spec_icon">{% for icon in icons %}<option value="{{ icon }}" {% if spec.icon == icon %}selected{% endif %}>{{ icon }}</option>{% endfor %}</select>
      <input name="spec_label" value="{{ spec.label }}" placeholder="Bezeichnung">
      <input name="spec_value" value="{{ spec.value }}" placeholder="Wert">
    </div>
    {% endfor %}
  </fieldset>
  <fieldset>
    <legend>Bilder</legend>
    {% for image in images %}
    <label class="check"><input type="checkbox" name="keep_image" value="{{ image }}" checked><img class="thumb" src="{{ image }}" alt=""> behalten</label>
    {% endfor %}
    <label>Neue Bilder<input type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple></label>
  </fieldset>
  <button class="btn" type="submit">Speichern</button>
</form>
{% if model %}
<form method="post" action="{{ url_for('admin.model_delete', model_id=model.id) }}" onsubmit="return confirm('Modell wirklich löschen?');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn danger" type="submit">Löschen</button>
</form>
{% endif %}
{% endblock %}
