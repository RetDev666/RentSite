{% extends "admin/base.html" %}
{% block body %}
<header class="page-head"><h1>{{ title }}</h1></header>
<form class="panel form-grid" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="pair">
    <label>Name<input name="name" required value="{{ extra.name if extra else '' }}"></label>
    <label>Slug<input name="slug" value="{{ extra.slug if extra else '' }}"></label>
  </div>
  <label>Beschreibung<textarea name="description" rows="4" required>{{ extra.description if extra else '' }}</textarea></label>
  <div class="pair">
    <label>Preis<input name="price" required value="{% if extra %}{{ money_input(extra.price_cents) }}{% endif %}"></label>
    <label>Art
      <select name="kind">
        {% for key, label in kind_labels.items() %}
        <option value="{{ key }}" {% if extra and extra.kind == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Reihenfolge<input name="sort_order" type="number" value="{{ extra.sort_order if extra else 0 }}"></label>
  </div>
  <label class="check"><input type="checkbox" name="active" value="1" {% if not extra or extra.active %}checked{% endif %}> aktiv</label>
  {% if extra and extra.image %}
  <label class="check"><input type="checkbox" name="keep_image" value="{{ extra.image }}" checked><img class="thumb" src="{{ extra.image }}" alt=""> Bild behalten</label>
  {% endif %}
  <label>Bild<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label>
  <button class="btn" type="submit">Speichern</button>
</form>
{% if extra %}
<form method="post" action="{{ url_for('admin.extra_delete', extra_id=extra.id) }}" onsubmit="return confirm('Extra löschen?');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn danger" type="submit">Löschen</button>
</form>
{% endif %}
{% endblock %}
