[build]
  command = "mkdir -p public && cp -r static public/ && pip install -r requirements.txt"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Serve static assets directly from Netlify CDN
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Route all web traffic to the Flask application function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
