[build]
  command = "pip install -r requirements.txt && python export_static.py"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Route API requests to the Netlify JavaScript Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Fallback 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
