[build]
  command = "pip install -r requirements.txt && python export_static.py"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# /api/* is served by netlify/functions/api.ts (path is set in the function config)

# Fallback 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
